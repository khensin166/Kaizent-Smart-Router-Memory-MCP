version: '3.8'

# Default configuration for Kaizent Router
# Note: Use docker-compose.prod.yml for production overrides

services:
  9router:
    build:
      context: .
      dockerfile: compose/9router.Dockerfile
    image: ${IMAGE_PREFIX:-kaizent}/9router:latest
    container_name: 9router
    ports:
      # Map 9Router's default port 20128 to host port 3000
      - "${KAIZENT_ROUTER_PORT:-3000}:20128"
    environment:
      - HOST=0.0.0.0
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-}
      - HTTP_PROXY=http://43.157.202.234:8888
      - HTTPS_PROXY=http://43.157.202.234:8888
    volumes:
      - ./data/9router:/root/.9router
    networks:
      - kaizent_network

networks:
  kaizent_network:
    driver: bridge
