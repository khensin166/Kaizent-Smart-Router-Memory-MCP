version: '3.8'

# Default configuration for Kaizent Router
# Note: Use docker-compose.prod.yml for production overrides

services:
  omniroute:
    build:
      context: .
      dockerfile: compose/omniroute.Dockerfile
    image: ${IMAGE_PREFIX:-kaizent}/omniroute:latest
    container_name: omniroute
    ports:
      # Map OmniRoute's default port 20128 to host port 3000
      - "${KAIZENT_ROUTER_PORT:-3000}:20128"
    environment:
      - HOST=0.0.0.0
      - INITIAL_PASSWORD=${INITIAL_PASSWORD:-}
      - HTTP_PROXY=http://43.157.202.234:8888
      - HTTPS_PROXY=http://43.157.202.234:8888
    volumes:
      - ./data/omniroute:/root/.omniroute
      - ./obsidian/Vault:/vault
    networks:
      - kaizent_network

networks:
  kaizent_network:
    driver: bridge
